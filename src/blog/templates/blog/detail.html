{% extends "base.html" %} {% block content %}
{% include 'blog/list_inline_template.html' with blog_post=object truncate=False detail=True %} 

{% if request.user.is_authenticated %}
  {% if request.user.is_staff %}
  <div class="container">
    <button class="btn btn-primary" onclick="window.location.href='{{object.get_edit_url}}'">Edit</button>
  <button class="btn btn-danger" onclick="window.location.href='{{object.get_delete_url}}'">Delete</button> 
  </div>
  {% endif %}
{% endif %}
{% endblock %}
